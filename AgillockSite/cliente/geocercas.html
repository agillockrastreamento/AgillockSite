<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    if(localStorage.getItem('al-theme')==='dark')document.documentElement.classList.add('dark-theme');
    if(localStorage.getItem('al-sidebar-state')==='collapsed')document.documentElement.classList.add('al-sb-collapsed');
  </script>
  <link rel="icon" href="../favicon.ico" type="image/x-icon" />
  <title>Geocercas — AgilLock</title>
  <link rel="stylesheet" href="../css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
  <style>
    body { overflow: hidden !important; height: 100vh; }
    .admin-content { height: 100vh; display: flex; flex-direction: column; padding-bottom: 0 !important; }
    #al-alert-container, .geo-filter-bar { flex-shrink: 0; }
    .geo-page-body { flex: 1; overflow-y: auto; padding: 24px 28px; }

    .geo-stats-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .geo-stat-card {
      flex: 1; min-width: 160px;
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      padding: 18px 22px; display: flex; align-items: center; gap: 16px;
    }
    html.dark-theme .geo-stat-card { background: #1e2530; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .geo-stat-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .geo-stat-icon-total   { background: #fff3e0; color: #fab32c; }
    .geo-stat-icon-ativas  { background: #e8f8f5; color: #27ae60; }
    html.dark-theme .geo-stat-icon-total  { background: #3d2e10; color: #fab32c; }
    html.dark-theme .geo-stat-icon-ativas { background: #0d2e1c; color: #27ae60; }
    .geo-stat-value { font-size: 28px; font-weight: 700; color: #222; line-height: 1; }
    html.dark-theme .geo-stat-value { color: #f0f2f5; }
    .geo-stat-label { font-size: 12px; color: #888; margin-top: 3px; }

    .geo-filter-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .geo-filter-bar .input-group { flex: 1; max-width: 380px; }

    .table-responsive { border-radius: 10px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
    html.dark-theme .table-responsive { background: #1e2530; }
    .admin-table thead th {
      position: sticky; top: 0; z-index: 2;
      background: #f8f9fa; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px; color: #777;
      border-bottom: 2px solid #eee; padding: 12px 14px; white-space: nowrap;
      box-shadow: 0 1px 0 #eee;
    }
    html.dark-theme .admin-table thead th { background: #1c2230; color: #6b7280; border-color: #2d3748; }
    .admin-table tbody td { padding: 12px 14px; font-size: 13px; vertical-align: middle; border-top: 1px solid #f0f0f0; }
    html.dark-theme .admin-table tbody td { border-color: #2d3748; color: #c9d1d9; }
    .admin-table tbody tr:hover td { background: #fafbfc; }
    html.dark-theme .admin-table tbody tr:hover td { background: #242c3a; }

    .geo-badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .geo-badge-circulo  { background: #eaf4fb; color: #2471a3; }
    .geo-badge-poligono { background: #e9f7ef; color: #1e8449; }
    .geo-badge-linha    { background: #fef9e7; color: #b7950b; }
    html.dark-theme .geo-badge-circulo  { background: #0d2040; color: #5dade2; }
    html.dark-theme .geo-badge-poligono { background: #0d2e1c; color: #58d68d; }
    html.dark-theme .geo-badge-linha    { background: #2e2200; color: #f4d03f; }

    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; }
    .status-ativo   { background: #e9f7ef; color: #1e8449; }
    .status-inativo { background: #fdecea; color: #c0392b; }
    html.dark-theme .status-ativo   { background: #0d2e1c; color: #58d68d; }
    html.dark-theme .status-inativo { background: #2e0d0d; color: #e74c3c; }

    .btn-acao {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; padding: 4px 10px; border-radius: 6px;
      border: 1px solid #ddd; background: #fff; color: #555;
      cursor: pointer; margin-right: 4px; transition: all .12s; font-weight: 600; white-space: nowrap;
    }
    html.dark-theme .btn-acao { background: #252535; border-color: #444; color: #c9d1d9; }
    .btn-acao:hover { border-color: #fab32c; color: #fab32c; }
    .btn-acao-danger:hover { border-color: #e74c3c !important; color: #e74c3c !important; background: #fdf0f0 !important; }

    #geo-loading td { text-align: center; padding: 48px 16px; color: #aaa; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="admin-sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../img/logo_agillock_white_new.png" alt="AgilLock" style="height:36px;" onerror="this.style.display='none'" />
    </div>
    <ul class="sidebar-nav">
      <li><a href="rastreamento.html"><i class="fa fa-map-marker fa-fw"></i> <span>Mapa</span></a></li>
      <li><a href="relatorio.html"><i class="fa fa-bar-chart fa-fw"></i> <span>Relatório</span></a></li>
      <li><a href="notificacoes.html"><i class="fa fa-bell fa-fw"></i> <span>Notificações</span></a></li>
      <li><a href="manutencoes.html"><i class="fa fa-wrench fa-fw"></i> <span>Manutenções</span></a></li>
      <li class="active"><a href="geocercas.html"><i class="fa fa-object-group fa-fw"></i> <span>Geocercas</span></a></li>
      <li id="li-pagamentos" style="display:none;"><a href="pagamentos.html"><i class="fa fa-money fa-fw"></i> <span>Pagamentos</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <span id="user-nome" class="sidebar-user-nome">—</span>
      </div>
      <button id="btn-tema" class="btn-tema-sidebar"></button>
      <button id="btn-logout" class="btn-logout"><i class="fa fa-sign-out"></i> <span>Sair</span></button>
    </div>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Conteúdo principal -->
  <div class="admin-content">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle" id="sidebar-toggle"><i class="fa fa-bars"></i></button>
        <h2 class="topbar-title">Geocercas</h2>
      </div>
      <div>
        <a href="geocercas-form.html" class="btn btn-primary-al">
          <i class="fa fa-plus"></i> Nova Geocerca
        </a>
      </div>
    </div>

    <div class="geo-page-body">

      <!-- Stats -->
      <div class="geo-stats-row">
        <div class="geo-stat-card">
          <div class="geo-stat-icon geo-stat-icon-total"><i class="fa fa-object-group"></i></div>
          <div>
            <div class="geo-stat-value" id="stat-total">—</div>
            <div class="geo-stat-label">Total de geocercas</div>
          </div>
        </div>
        <div class="geo-stat-card">
          <div class="geo-stat-icon geo-stat-icon-ativas"><i class="fa fa-check-circle"></i></div>
          <div>
            <div class="geo-stat-value" id="stat-ativas">—</div>
            <div class="geo-stat-label">Ativas</div>
          </div>
        </div>
      </div>

      <!-- Filter -->
      <div class="geo-filter-bar">
        <div class="input-group">
          <span class="input-group-addon"><i class="fa fa-search"></i></span>
          <input type="text" id="filtro-busca" class="form-control" placeholder="Buscar por nome..." />
        </div>
      </div>

      <!-- Table -->
      <div class="table-responsive">
        <table class="table admin-table" style="margin-bottom:0">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Tipo</th>
              <th>Dispositivos</th>
              <th>Notificação</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="geo-tbody">
            <tr id="geo-loading">
              <td colspan="6">
                <i class="fa fa-spinner fa-spin" style="margin-right:8px;color:#fab32c"></i> Carregando geocercas...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="../js/jquery.js"></script>
  <script src="../js/bootstrap.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth-guard-cliente.js"></script>
  <script>
    (function () {
      var user = AL_CLIENTE.requireAuth();
      if (!user) return;
      document.getElementById('user-nome').textContent = user.nome || user.email || '—';
      document.getElementById('sidebar-toggle').addEventListener('click', function () {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebar-overlay').classList.toggle('open');
      });
      document.getElementById('sidebar-overlay').addEventListener('click', function () {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('open');
      });
      document.getElementById('btn-logout').addEventListener('click', AL_CLIENTE.logout);
      AL_CLIENTE.initThemeToggle('btn-tema');
      if (user.tipo === 'responsavel') document.getElementById('li-pagamentos').style.display = 'block';
    })();
  </script>
  <script src="../js/geocercas-cliente.js"></script>

</body>
</html>
