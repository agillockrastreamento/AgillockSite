<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Acompanhamento — AgilLock</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Montserrat', sans-serif; background: #1e2530; }

    /* ── Loading / Erro ── */
    #pub-loading, #pub-error {
      position: fixed; inset: 0;
      background: #1e2530;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; color: #fff; text-align: center; padding: 24px;
    }
    #pub-error { display: none; }
    #pub-loading img, #pub-error img { height: 56px; margin-bottom: 20px; }
    #pub-loading p { font-size: 14px; color: #aaa; margin: 0; }
    #pub-error h2 { font-size: 20px; margin: 0 0 8px; }
    #pub-error p  { font-size: 14px; color: #aaa; margin: 0; }
    .pub-spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.15);
      border-top-color: #fab32c; border-radius: 50%;
      animation: pub-spin .8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes pub-spin { to { transform: rotate(360deg); } }

    /* ── Mapa container ── */
    #mapa-container { position: fixed; inset: 0; transition: bottom .3s cubic-bezier(.4,0,.2,1); }
    #mapa { width: 100%; height: 100%; }

    /* ── Logo flutuante (quando card está fechado) ── */
    #pub-logo {
      position: absolute; top: 12px; left: 12px; z-index: 900;
      pointer-events: none; display: block;
    }
    #pub-logo img { height: 36px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }

    /* ── Leaflet overrides ── */
    .leaflet-control-layers {
      width: 35px !important; height: 35px !important;
      background: #fff !important; border-radius: 50% !important;
      border: 2px solid #c2c1c1 !important; box-shadow: none !important;
      overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 0 !important;
    }
    .leaflet-control-layers-toggle { width: 35px !important; height: 35px !important; background-size: 20px !important; margin: 0 !important; }
    .leaflet-control-layers-expanded { width: auto !important; height: auto !important; border-radius: 8px !important; padding: 10px !important; }
    .leaflet-bar { box-shadow: none !important; background: #fff !important; border-radius: 20px !important; border: 2px solid #c2c1c1 !important; overflow: hidden !important; display: flex !important; flex-direction: column !important; }
    .leaflet-bar a { width: 35px !important; height: 35px !important; border-radius: 0 !important; border: none !important; border-bottom: 1px solid #c2c1c1 !important; background: transparent !important; color: #555 !important; font-size: 18px !important; display: flex !important; align-items: center !important; justify-content: center !important; text-decoration: none !important; line-height: 1 !important; }
    .leaflet-bar a:last-child { border-bottom: none !important; }
    .leaflet-bar a:hover { background: #f0f0f0 !important; }

    /* ── Botões de controle do mapa ── */
    .pub-map-control-btn {
      width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; border: 2px solid #c2c1c1; background: #fff; color: #555;
      cursor: pointer; box-shadow: none; padding: 0; line-height: 1; font-size: 15px;
    }
    .pub-map-control-btn.ativo { background: #fab32c; border-color: #fab32c; color: #222; }
    .pub-map-control-btn:hover:not(.ativo) { background: #f0f0f0; }

    /* ── Bandeja de camadas (Labels + Rastro) ── */
    #pub-mapa-tray {
      position: absolute; top: 10px; right: 52px; z-index: 940;
      background: rgba(20,20,30,0.88); backdrop-filter: blur(6px);
      border-radius: 12px; padding: 10px;
      display: flex; flex-direction: row; align-items: center; gap: 8px;
      transform: translateX(8px); opacity: 0;
      transition: transform .2s ease, opacity .2s ease;
      pointer-events: none;
    }
    #pub-mapa-tray::after {
      content: ""; position: absolute; top: 9px; right: -7px; width: 0; height: 0;
      border-top: 7px solid transparent; border-bottom: 7px solid transparent;
      border-left: 7px solid rgba(20,20,30,0.88);
    }
    #pub-mapa-tray.aberta { transform: translateX(0); opacity: 1; pointer-events: all; }
    .pub-ml-btn {
      display: flex; align-items: center; gap: 10px;
      background: none; border: none; cursor: pointer;
      padding: 6px 10px; border-radius: 8px;
      color: #fff; font-size: 12px; font-weight: 600;
      white-space: nowrap; transition: background .12s;
      font-family: 'Montserrat', sans-serif;
    }
    .pub-ml-btn:hover { background: rgba(255,255,255,.1); }
    .pub-ml-btn.ativo { background: rgba(250,179,44,.18); }
    .pub-ml-btn-icon {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
      transition: background .12s, border-color .12s;
    }
    .pub-ml-btn.ativo .pub-ml-btn-icon { background: rgba(250,179,44,.35); border-color: #fab32c; color: #fab32c; }

    /* ── Card flutuante do dispositivo (desktop) ── */
    #pub-device-card {
      display: none;
      position: absolute; top: 80px; left: 12px;
      z-index: 2100;
      width: 290px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      overflow: hidden;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: #ccc #fff;
    }
    #pub-device-card::-webkit-scrollbar { width: 5px; }
    #pub-device-card::-webkit-scrollbar-track { background: #fff; }
    #pub-device-card::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    .pub-dcard-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 10px 12px 8px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }
    .pub-v-nome { font-weight: 700; font-size: 14px; color: #222; line-height: 1.3; }
    .pub-v-placa {
      display: inline-block; background: #333; color: #fff;
      padding: 0 6px; border-radius: 3px; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    }
    .pub-dcard-fechar {
      background: none; border: none; font-size: 20px; line-height: 1;
      color: #bbb; cursor: pointer; padding: 0 2px; flex-shrink: 0; margin-top: -2px;
    }
    .pub-dcard-fechar:hover { color: #e74c3c; }

    .pub-dcard-body {
      padding: 10px 12px 10px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .pub-dcard-section {
      font-size: 11px;
      border-top: 1px solid rgba(128,128,128,.15);
      padding-top: 6px; margin-top: 6px; line-height: 1.7;
    }
    .pub-dcard-val { color: #333; }
    .pub-dcard-lbl { font-weight: 600; color: #333; }
    .pub-dcard-section-title {
      font-size: 11px; font-weight: 900; color: #141414;
      letter-spacing: .3px; line-height: 1.2; margin-bottom: 6px;
    }

    .pub-dcard-maps-btn {
      width: 30px; height: 25px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 6px; border: 1px solid rgba(41,128,185,.18); background: #eef6fc; color: #2980b9;
      text-decoration: none; transition: all .2s ease; font-size: 11px;
    }
    .pub-dcard-maps-btn:hover { background: #d9ebf7; color: #21618c; transform: scale(1.05); }

    .pub-dcard-footer {
      flex-shrink: 0;
      padding: 8px 12px 10px;
      border-top: 1px solid rgba(128,128,128,.12);
      background: #fafafa;
    }

    /* ── Botão de "reabrir card" quando fechado (desktop) ── */
    #pub-btn-reabrir {
      display: none;
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 2100;
      background: rgba(20,20,30,0.88); color: #fff;
      border: none; border-radius: 24px; padding: 10px 20px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }
    #pub-btn-reabrir i { margin-right: 6px; }

    /* ── Popup Leaflet ── */
    .pub-popup .leaflet-popup-content-wrapper {
      padding: 0 !important; border-radius: 6px !important; overflow: hidden !important;
      background: #fff !important; box-shadow: 0 2px 8px rgba(0,0,0,.18) !important;
    }
    .pub-popup .leaflet-popup-tip { background: #fff !important; }
    .pub-popup .leaflet-popup-content { margin: 0 !important; width: auto !important; min-width: 0 !important; }

    /* ── MOBILE: Gaveta ── */
    @media (max-width: 600px) {
      /* Card vira gaveta bottom-sheet */
      #pub-device-card {
        position: fixed !important;
        top: auto !important; left: 0 !important;
        bottom: 0; right: 0;
        width: 100% !important;
        max-width: 100% !important;
        max-height: none !important;
        height: 30vh;          /* padrão: 30% fechada */
        border-radius: 16px 16px 0 0 !important;
        box-shadow: 0 -4px 24px rgba(0,0,0,.22) !important;
        overflow: hidden;
        flex-direction: column;
        transition: height .3s cubic-bezier(.4,0,.2,1);
        will-change: height;
        touch-action: none;    /* evita scroll nativo interferir no gesto */
      }
      #pub-device-card.drawer-aberta { height: 50vh; }

      /* Handle da gaveta */
      #pub-drawer-handle {
        display: flex; align-items: center; justify-content: center;
        padding: 10px 0 4px;
        flex-shrink: 0;
        cursor: grab;
        touch-action: none;
      }
      #pub-drawer-handle::before {
        content: '';
        display: block;
        width: 36px; height: 4px;
        background: #ccc;
        border-radius: 2px;
      }

      /* Header mais compacto */
      .pub-dcard-header { padding: 6px 12px 6px; }

      /* Mapa sobe quando gaveta abre — ícone não fica escondido */
      #mapa-container { bottom: 30vh !important; }
      #mapa-container.mapa-expandido { bottom: 50vh !important; }

      /* Imagem + nome/placa lado a lado no topo do card mobile */
      #pub-img-vel-row {
        display: flex; gap: 12px; align-items: center;
        padding: 6px 12px 0; margin-bottom: 4px;
      }
      #pub-img-wrap { flex-shrink: 0; margin-left: 4px; }
      #pub-img-wrap img {
        width: 64px; height: 64px;
        object-fit: cover; border-radius: 8px; display: block;
      }
      #pub-nome-mobile {
        flex: 1; min-width: 0;
        display: flex; flex-direction: column; justify-content: center; gap: 5px;
      }

      /* Oculta botão de reabrir no mobile (usa a gaveta) */
      #pub-btn-reabrir { display: none !important; }

      /* Oculta o rodapé de branding no mobile */
      .pub-dcard-footer { display: none !important; }

      /* Oculta atribuição do Leaflet no mobile */
      .leaflet-control-attribution { display: none !important; }

      /* Labels da bandeja: texto oculto */
      .pub-ml-btn span:not(.pub-ml-btn-icon) { display: none; }
      .pub-ml-btn { padding: 4px; }
    }

    /* handle oculto apenas no desktop */
    @media (min-width: 601px) {
      #pub-drawer-handle { display: none; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      #pub-device-card { max-height: calc(100vh - 24px); }
    }

    /* ── Legenda de status (canto inferior direito) ── */
    #pub-legenda {
      position: absolute; bottom: 28px; right: 10px; z-index: 900;
      background: rgba(255,255,255,.92); backdrop-filter: blur(4px);
      border-radius: 8px; padding: 8px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      font-family: 'Montserrat', sans-serif; font-size: 11px;
      pointer-events: none;
    }
    .pub-legenda-item { display: flex; align-items: center; gap: 7px; padding: 2px 0; color: #333; }
    .pub-legenda-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    #pub-legenda-btn { display: none; }
    #pub-legenda-modal { display: none; }
    @media (max-width: 600px) {
      #pub-legenda { display: none; }
      #pub-legenda-btn {
        display: flex; align-items: center; justify-content: center;
        position: fixed; bottom: calc(30vh + 8px); right: 10px;
        z-index: 2200; width: 36px; height: 36px;
        border-radius: 50%; border: 2px solid rgba(200,200,200,.8);
        background: rgba(255,255,255,.92); color: #555; font-size: 16px;
        cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.15);
        transition: bottom .3s cubic-bezier(.4,0,.2,1);
      }
      #pub-legenda-btn.drawer-open { bottom: calc(50vh + 8px); }
      #pub-legenda-modal.aberto { display: block; }
      #pub-legenda-modal-overlay { position: fixed; inset: 0; z-index: 3001; }
      #pub-legenda-modal-box {
        position: fixed; bottom: calc(30vh + 52px); right: 10px;
        z-index: 3002; background: #fff; border-radius: 10px;
        padding: 14px 16px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
        min-width: 170px; font-family: 'Montserrat', sans-serif;
      }
      #pub-legenda-modal-box h6 { font-size: 13px; font-weight: 700; margin: 0 0 10px; color: #222; }
      #pub-legenda-modal-box .pub-legenda-item { font-size: 12px; padding: 3px 0; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="pub-loading">
    <img src="img/logo_agillock_white_new.png" alt="AgilLock" onerror="this.style.display='none'" />
    <div class="pub-spinner"></div>
    <p>Carregando acompanhamento...</p>
  </div>

  <!-- Erro -->
  <div id="pub-error">
    <img src="img/logo_agillock_white_new.png" alt="AgilLock" onerror="this.style.display='none'" />
    <h2 id="pub-error-titulo">Link inválido</h2>
    <p id="pub-error-msg">O link de acompanhamento é inválido ou expirou.</p>
  </div>

  <!-- Mapa -->
  <div id="mapa-container">
    <div id="mapa"></div>

    <!-- Logo (visível antes do card carregar) -->
    <div id="pub-logo">
      <img src="img/logo_agillock_white_new.png" alt="AgilLock" />
    </div>

    <!-- Bandeja de camadas: Labels + Rastro -->
    <div id="pub-mapa-tray">
      <button class="pub-ml-btn ativo" id="pub-ml-labels">
        <span class="pub-ml-btn-icon"><i class="fa fa-comment"></i></span>
        <span>Labels</span>
      </button>
      <button class="pub-ml-btn" id="pub-ml-rastro">
        <span class="pub-ml-btn-icon"><i class="fa fa-ellipsis-h"></i></span>
        <span>Rastro</span>
      </button>
    </div>

    <!-- Card do dispositivo -->
    <div id="pub-device-card">
      <div id="pub-drawer-handle"></div>
    </div>

    <!-- Botão flutuante para reabrir o card quando fechado -->
    <button id="pub-btn-reabrir" onclick="reabrirCard()">
      <i class="fa fa-car"></i> Ver Veículo
    </button>

    <!-- Legenda de status — desktop: canto inferior direito; mobile: botão + modal -->
    <div id="pub-legenda">
      <div class="pub-legenda-item"><span class="pub-legenda-dot" style="background:#2980b9"></span> Em movimento</div>
      <div class="pub-legenda-item"><span class="pub-legenda-dot" style="background:#27ae60"></span> Parado</div>
      <div class="pub-legenda-item"><span class="pub-legenda-dot" style="background:#95a5a6"></span> Offline</div>
    </div>
    <button id="pub-legenda-btn" onclick="toggleLegendaMob()" title="Legenda">
      <i class="fa fa-info-circle"></i>
    </button>
    <div id="pub-legenda-modal">
      <div id="pub-legenda-modal-overlay" onclick="toggleLegendaMob()"></div>
      <div id="pub-legenda-modal-box">
        <h6>Legenda</h6>
        <div class="pub-legenda-item"><span class="pub-legenda-dot" style="background:#2980b9"></span> Em movimento</div>
        <div class="pub-legenda-item"><span class="pub-legenda-dot" style="background:#27ae60"></span> Parado</div>
        <div class="pub-legenda-item"><span class="pub-legenda-dot" style="background:#95a5a6"></span> Offline</div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/rastreamento-publico.js"></script>
  <script>
    // Mostra/oculta o botão de reabrir conforme o card
    const _cardObs = new MutationObserver(function () {
      const card = document.getElementById('pub-device-card');
      const btn = document.getElementById('pub-btn-reabrir');
      if (!card || !btn) return;
      const visivel = card.style.display !== 'none' && card.style.display !== '';
      btn.style.display = visivel ? 'none' : 'block';
    });
    document.addEventListener('DOMContentLoaded', function () {
      const card = document.getElementById('pub-device-card');
      if (card) _cardObs.observe(card, { attributes: true, attributeFilter: ['style'] });
    });

    function reabrirCard() {
      if (window._dadosPublico && window._mostrarCard) {
        window._mostrarCard(window._dadosPublico);
      }
    }
  </script>
</body>
</html>
