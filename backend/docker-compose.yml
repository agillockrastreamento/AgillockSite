# Compose de PRODUÇÃO do servidor 179.198.102.3 (backend + nginx/SSL).
# Pós-migração para 3 servidores: postgres e traccar rodam no 2.25.131.149
# (/opt/traccar), e o backend acessa ambos pela rede Docker externa
# `traccar_traccar_net`. Detalhes em docs/projeto/INFRAESTRUTURA.md.
# Para o ambiente de dev local use docker-compose.dev.yml (npm run dev).
services:
  backend:
    build: .
    container_name: agillock-backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agillock_user:${POSTGRES_PASSWORD}@postgres:5432/agillock
      TZ: America/Sao_Paulo
    volumes:
      - ./cert:/app/cert:ro
      - ./uploads:/app/uploads
    ports:
      - "3000:3000"
    networks:
      - default
  nginx:
    image: nginx:alpine
    container_name: agillock-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - default
networks:
  default:
    external: true
    name: traccar_traccar_net
