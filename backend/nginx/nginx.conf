events {}

http {
    server {
        listen 80;
        server_name api.agillock.com.br;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.agillock.com.br;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10m;

        location / {
            proxy_pass         http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Relatórios de período longo (ex.: 30 dias) chegam a levar 1-2 min no
            # Traccar. O padrão do nginx (60s) matava a requisição e devolvia um 504
            # SEM cabeçalho CORS — o browser reportava como "erro de CORS". Elevado
            # para dar folga; o backend já limita o trabalho pesado internamente.
            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }
    }
}
